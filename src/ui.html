<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy composite node ID</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 8px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font: 12px/1.4 Inter, -apple-system, sans-serif;
      }

      button {
        width: 100%;
        height: 32px;
        border: 0;
        border-radius: 6px;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
        cursor: pointer;
        font: inherit;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background 0.1s ease;
      }

      button:hover:not(:disabled) {
        background: var(--figma-color-bg-brand-hover);
      }

      button:disabled {
        color: var(--figma-color-text-disabled);
        background: var(--figma-color-bg-secondary);
        cursor: default;
      }

      button.success {
        background: var(--figma-color-bg-success, #18a957);
        color: #fff;
      }

      #hidden-ta {
        position: fixed;
        left: -9999px;
        top: -9999px;
        width: 20px;
        height: 20px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <textarea id="hidden-ta"></textarea>
    <button id="copy-btn" type="button" disabled>Select a layer</button>

    <script>
      let currentPayload = null;
      let resetTimer = null;
      const copyBtn = document.getElementById("copy-btn");
      const hiddenTa = document.getElementById("hidden-ta");

      function post(message) {
        parent.postMessage({ pluginMessage: message }, "*");
      }

      async function copyText(text) {
        let success = false;
        try {
          hiddenTa.value = text;
          window.focus();
          hiddenTa.focus();
          hiddenTa.select();
          hiddenTa.setSelectionRange(0, text.length);
          success = document.execCommand("copy");
        } catch (_) {}

        if (!success && navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            success = true;
          } catch (_) {}
        }

        return success;
      }

      function updateUI(payload) {
        currentPayload = payload;
        clearTimeout(resetTimer);
        copyBtn.classList.remove("success");

        if (payload) {
          copyBtn.disabled = false;
          copyBtn.textContent = "Copy composite node ID";
        } else {
          copyBtn.disabled = true;
          copyBtn.textContent = "Select a layer";
        }
      }

      copyBtn.addEventListener("click", async () => {
        if (!currentPayload) return;
        const success = await copyText(currentPayload.text);
        if (success) {
          copyBtn.textContent = "✓ Copied!";
          copyBtn.classList.add("success");
          clearTimeout(resetTimer);
          resetTimer = setTimeout(() => {
            copyBtn.classList.remove("success");
            copyBtn.textContent = "Copy composite node ID";
          }, 1200);
        }
      });

      window.addEventListener("message", async (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "selection") {
          updateUI(message.payload);
        }

        if (message.type === "copy") {
          post({ type: "copy-result", success: await copyText(message.text) });
        }
      });

      post({ type: "ready" });
    </script>
  </body>
</html>
