<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy composite node ID</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 8px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font: 12px/1.4 Inter, -apple-system, sans-serif;
        overflow: hidden;
      }

      button {
        width: 100%;
        height: 32px;
        border: 0;
        border-radius: 6px;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
        cursor: pointer;
        font: inherit;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background 0.1s ease;
      }

      button:hover:not(:disabled) {
        background: var(--figma-color-bg-brand-hover);
      }

      button:disabled {
        color: var(--figma-color-text-disabled);
        background: var(--figma-color-bg-secondary);
        cursor: default;
      }

      button.success {
        background: var(--figma-color-bg-success, #18a957);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <button id="copy-btn" type="button" disabled>Select a layer</button>

    <script>
      let currentPayload = null;
      let resetTimer = null;
      const copyBtn = document.getElementById("copy-btn");

      function post(message) {
        console.log("[CopyUI] Posting to plugin:", message);
        parent.postMessage({ pluginMessage: message }, "*");
      }

      function execCopy(text) {
        console.log("[CopyUI] execCopy called. Text length:", text ? text.length : 0);
        const copyFrom = document.createElement("textarea");
        copyFrom.textContent = text;
        copyFrom.style.position = "fixed";
        copyFrom.style.left = "0";
        copyFrom.style.top = "0";
        copyFrom.style.width = "10px";
        copyFrom.style.height = "10px";
        copyFrom.style.opacity = "0.01";
        document.body.appendChild(copyFrom);

        copyFrom.focus({ preventScroll: true });
        copyFrom.select();

        let success = false;
        try {
          success = document.execCommand("copy");
          console.log("[CopyUI] execCommand copy result:", success);
        } catch (e) {
          console.error("[CopyUI] execCommand error:", e);
        }

        document.body.removeChild(copyFrom);

        if (!success && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
          success = true;
          console.log("[CopyUI] navigator.clipboard.writeText fallback used");
        }
        return success;
      }

      function updateUI(payload) {
        console.log("[CopyUI] updateUI received payload:", payload);
        currentPayload = payload;
        clearTimeout(resetTimer);
        copyBtn.classList.remove("success");

        if (payload) {
          copyBtn.disabled = false;
          copyBtn.textContent = "Copy composite node ID";
        } else {
          copyBtn.disabled = true;
          copyBtn.textContent = "Select a layer";
        }
      }

      copyBtn.addEventListener("click", () => {
        console.log("[CopyUI] Button clicked. currentPayload:", currentPayload);
        if (!currentPayload) {
          console.warn("[CopyUI] Click ignored: no layer selected");
          return;
        }
        const success = execCopy(currentPayload.text);
        if (success) {
          copyBtn.textContent = "✓ Copied!";
          copyBtn.classList.add("success");
          clearTimeout(resetTimer);
          resetTimer = setTimeout(() => {
            copyBtn.classList.remove("success");
            copyBtn.textContent = "Copy composite node ID";
          }, 1200);
          post({ type: "copied", name: currentPayload.name });
        } else {
          copyBtn.textContent = "Copy failed";
          clearTimeout(resetTimer);
          resetTimer = setTimeout(() => {
            copyBtn.textContent = "Copy composite node ID";
          }, 1500);
        }
      });

      window.addEventListener("message", (event) => {
        const message = event.data.pluginMessage;
        console.log("[CopyUI] Received message from plugin:", message);
        if (!message) return;

        if (message.type === "selection") {
          updateUI(message.payload);
        }

        if (message.type === "copy") {
          const success = execCopy(message.text);
          post({ type: "copy-done", success });
        }
      });

      console.log("[CopyUI] UI script initialized, sending ready");
      post({ type: "ready" });
    </script>
  </body>
</html>
