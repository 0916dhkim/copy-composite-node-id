<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copy composite node ID</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 8px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font: 12px/1.4 Inter, -apple-system, sans-serif;
      }

      button {
        width: 100%;
        height: 32px;
        border: 0;
        border-radius: 6px;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
        cursor: pointer;
        font: inherit;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: background 0.1s ease;
      }

      button:hover:not(:disabled) {
        background: var(--figma-color-bg-brand-hover);
      }

      button:disabled {
        color: var(--figma-color-text-disabled);
        background: var(--figma-color-bg-secondary);
        cursor: default;
      }

      button.success {
        background: var(--figma-color-bg-success, #18a957);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <button id="copy-btn" type="button" disabled>Select a layer</button>

    <script>
      let currentPayload = null;
      let resetTimer = null;
      const copyBtn = document.getElementById("copy-btn");

      function post(message) {
        parent.postMessage({ pluginMessage: message }, "*");
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.cssText = "position:fixed;opacity:0;pointer-events:none";
          document.body.appendChild(textarea);
          textarea.select();
          const copied = document.execCommand("copy");
          textarea.remove();
          return copied;
        }
      }

      function updateUI(payload) {
        currentPayload = payload;
        clearTimeout(resetTimer);
        copyBtn.classList.remove("success");

        if (payload) {
          copyBtn.disabled = false;
          copyBtn.textContent = "Copy composite node ID";
        } else {
          copyBtn.disabled = true;
          copyBtn.textContent = "Select a layer";
        }
      }

      copyBtn.addEventListener("click", async () => {
        if (!currentPayload) return;
        const success = await copyText(currentPayload.text);
        if (success) {
          copyBtn.textContent = "✓ Copied!";
          copyBtn.classList.add("success");
          clearTimeout(resetTimer);
          resetTimer = setTimeout(() => {
            copyBtn.classList.remove("success");
            copyBtn.textContent = "Copy composite node ID";
          }, 1200);
        }
      });

      window.addEventListener("message", async (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "selection") {
          updateUI(message.payload);
        }

        if (message.type === "copy") {
          post({ type: "copy-result", success: await copyText(message.text) });
        }
      });

      post({ type: "ready" });
    </script>
  </body>
</html>
